<style>
  .crm { --c-line: var(--color-base-200); --c-card: #fff; --c-muted: var(--color-base-500); --c-ink: var(--color-base-900); --c-soft: var(--color-base-50); --c-accent: var(--color-primary-500); }
  .dark .crm { --c-line: var(--color-base-800); --c-card: var(--color-base-900); --c-muted: var(--color-base-400); --c-ink: var(--color-base-100); --c-soft: var(--color-base-950); }
  .crm { color: var(--c-ink); }
  .crm-grid { display: grid; gap: 16px; }
  .crm-kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
  .crm-two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: 16px; }

  .crm-kpi a { color: inherit; }
  .crm-row { display: grid; grid-template-columns: 140px 1fr 44px; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 8px; }
  .crm-bar { height: 8px; border-radius: 4px; background: var(--c-soft); overflow: hidden; }
  .crm-bar span { display: block; height: 100%; background: var(--c-accent); border-radius: 4px; }
  .crm-row b { text-align: right; }

  .crm-table { width: 100%; border-collapse: collapse; font-size: 13px; }

  .crm-muted { color: var(--c-muted); }

  .crm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .crm-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--c-line); background: var(--c-card); font-size: 13px; font-weight: 600; }

  .kcol { background: var(--c-soft); border: 1px solid var(--c-line); border-radius: 8px; padding: 10px; min-height: 240px; }

  .kcard .km { color: var(--c-muted); }
  .kcard .kf { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; }
  .kcard .overdue { color: #dc2626; font-weight: 600; }
